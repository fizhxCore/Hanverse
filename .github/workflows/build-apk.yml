name: hanverse

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Folder android/ (gradle wrapper, dll) sengaja tidak di-commit ke repo
      # karena berisi file boilerplate/biner bawaan Flutter. Di-generate
      # otomatis di sini setiap build, lib/ dan pubspec.yaml kita tidak
      # tersentuh karena sudah ada isinya.
      - name: Generate platform Android
        run: flutter create --platforms=android --org com.hanverse .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Analisa kode (opsional, tidak menggagalkan build)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: hanverse-apk
          path: build/app/outputs/flutter-apk/app-release.apk
